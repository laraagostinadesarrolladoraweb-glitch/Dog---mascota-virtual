<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Dogui - Mi Mascota Virtual</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at center, #fff7ed 0%, #ffedd5 100%);
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 16px 16px max(20px, env(safe-area-inset-bottom));
    }

    .bg-particle {
      position: absolute;
      background: rgba(255, 255, 255, 0.7);
      border-radius: 50%;
      pointer-events: none;
      animation: floatBg 8s infinite ease-in-out;
    }

    @keyframes floatBg {
      0%, 100% { transform: translateY(0) scale(1); opacity: 0.5; }
      50% { transform: translateY(-30px) scale(1.1); opacity: 0.9; }
    }

    .top-panel {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      z-index: 20;
    }

    .nombre-mascota {
      color: #c2410c;
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .barras-container {
      width: 100%;
      display: flex;
      gap: 10px;
      background: rgba(255, 255, 255, 0.9);
      padding: 10px 14px;
      border-radius: 16px;
      box-shadow: 0 4px 12px rgba(194, 65, 12, 0.08);
      border: 2px solid rgba(255, 255, 255, 0.8);
    }

    .barra-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .barra-label {
      font-size: 11px;
      font-weight: 800;
      color: #9a3412;
      display: flex;
      justify-content: space-between;
    }

    .progreso-track {
      background: #fed7aa;
      height: 10px;
      border-radius: 10px;
      overflow: hidden;
      position: relative;
    }

    .progreso-fill {
      height: 100%;
      width: 100%;
      border-radius: 10px;
      transition: width 0.4s ease;
    }

    #fill-hambre { background: linear-gradient(90deg, #34d399, #10b981); }
    #fill-felicidad { background: linear-gradient(90deg, #38bdf8, #0284c7); } /* Cambiado a turquesa/celeste vibrante */

    .stage {
      flex: 1;
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      z-index: 5;
    }

    .speech-bubble {
      background: #ffffff;
      color: #9a3412;
      padding: 10px 16px;
      border-radius: 16px;
      font-weight: 700;
      font-size: 12px;
      line-height: 1.4;
      box-shadow: 0 6px 16px rgba(194, 65, 12, 0.1);
      margin-bottom: 12px;
      position: relative;
      border: 2px solid #fb923c;
      max-width: 90%;
      text-align: center;
    }

    .speech-bubble::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 8px 8px 0;
      border-style: solid;
      border-color: #ffffff transparent;
    }

    .michi-wrapper {
      width: 160px;
      height: 160px;
      cursor: pointer;
      position: relative;
      animation: floatIdle 3.5s infinite ease-in-out;
      outline: none;
    }

    @keyframes floatIdle {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    .michi-wrapper.happy-bounce { animation: bounce 0.6s ease; }
    .michi-wrapper.eat-wiggle { animation: chew 0.8s ease; }
    .michi-wrapper.catch-ball { animation: catchJump 0.8s ease; }

    @keyframes bounce {
      0%, 100% { transform: translateY(0) scale(1); }
      30% { transform: translateY(-20px) scale(1.1, 0.9); }
    }

    @keyframes chew {
      0%, 100% { transform: scale(1); }
      30% { transform: scale(1.08, 0.92); }
      60% { transform: scale(0.95, 1.05); }
    }

    @keyframes catchJump {
      0% { transform: translateY(0); }
      30% { transform: translateY(-25px) rotate(-8deg); }
      100% { transform: translateY(0); }
    }

    .animated-item {
      position: absolute;
      font-size: 28px;
      pointer-events: none;
      z-index: 15;
    }

    .anim-bowl { animation: dropBowl 0.6s forwards; }
    @keyframes dropBowl {
      0% { transform: translateY(-80px) scale(1.2); opacity: 1; }
      100% { transform: translateY(10px) scale(0.4); opacity: 0; }
    }

    .anim-frisbee { animation: throwFrisbee 0.8s forwards; }
    @keyframes throwFrisbee {
      0% { transform: translate(-100px, 40px) scale(1) rotate(0deg); }
      50% { transform: translate(-20px, -30px) scale(1.2) rotate(180deg); }
      100% { transform: translate(0px, 10px) scale(0.2) rotate(360deg); opacity: 0; }
    }

    .shadow {
      width: 100px;
      height: 12px;
      background: rgba(194, 65, 12, 0.15);
      border-radius: 50%;
      margin-top: 6px;
    }

    .controls {
      width: 100%;
      max-width: 380px;
      display: flex;
      gap: 12px;
      background: #ffffff;
      padding: 8px;
      border-radius: 18px;
      box-shadow: 0 6px 18px rgba(194, 65, 12, 0.15);
      border: 2px solid #fb923c;
      z-index: 20;
    }

    .btn {
      flex: 1;
      background: #ffedd5;
      color: #9a3412;
      border: none;
      padding: 12px;
      border-radius: 14px;
      font-weight: 900;
      font-size: 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      touch-action: manipulation;
      transition: background 0.2s ease, transform 0.1s ease;
      outline: none;
    }

    .btn:active {
      transform: scale(0.95);
      background: #fed7aa;
    }

    .btn-icon { font-size: 18px; }

    .heart-particle {
      position: absolute;
      pointer-events: none;
      animation: floatUp 1.2s forwards ease-out;
      z-index: 30;
    }

    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(0.8); }
      100% { opacity: 0; transform: translateY(-60px) scale(1.3); }
    }
  </style>
</head>
<body>

  <div class="bg-particle" style="width: 70px; height: 70px; top: 10%; left: 5%;"></div>
  <div class="bg-particle" style="width: 100px; height: 100px; top: 50%; right: 5%;"></div>

  <div class="top-panel">
    <div class="nombre-mascota">Dogui</div>

    <div class="barras-container">
      <div class="barra-item">
        <div class="barra-label"><span>Hambre</span><span id="txt-hambre">100%</span></div>
        <div class="progreso-track"><div class="progreso-fill" id="fill-hambre"></div></div>
      </div>
      <div class="barra-item">
        <div class="barra-label"><span>Felicidad</span><span id="txt-felicidad">100%</span></div>
        <div class="progreso-track"><div class="progreso-fill" id="fill-felicidad"></div></div>
      </div>
    </div>
  </div>

  <div class="stage" id="stage-area">
    <div class="speech-bubble" id="bocadillo">¡Hola! Tócame para recibir cariño o aprender algo nuevo 🐾</div>
    
    <!-- SVG de un Perro tierno estándar -->
    <div class="michi-wrapper" id="michi-box" onclick="acariciar(event)">
      <svg id="michi-svg" viewBox="0 0 100 100" width="100%" height="100%">
        <!-- Orejas colgantes de perrito -->
        <path d="M 28 42 C 18 50 22 72 30 70 C 35 68 35 55 33 45 Z" fill="#b45309" stroke="#78350f" stroke-width="1.5"/>
        <path d="M 72 42 C 82 50 78 72 70 70 C 65 68 65 55 67 45 Z" fill="#b45309" stroke="#78350f" stroke-width="1.5"/>
        
        <!-- Cabeza y cuerpo -->
        <circle cx="50" cy="58" r="28" fill="#d97706" stroke="#b45309" stroke-width="2"/>
        <circle cx="50" cy="42" r="22" fill="#d97706" stroke="#b45309" stroke-width="2"/>
        
        <!-- Mancha en el ojo / detalles de perrito -->
        <ellipse cx="50" cy="48" rx="11" ry="9" fill="#fef3c7"/>
        <ellipse cx="50" cy="46" rx="4" ry="3" fill="#1f110b"/>
        
        <!-- Ojos -->
        <g id="ojos">
          <circle cx="39" cy="38" r="4" fill="#1f110b"/>
          <circle cx="37.8" cy="36.8" r="1.2" fill="#ffffff"/>
          <circle cx="61" cy="38" r="4" fill="#1f110b"/>
          <circle cx="59.8" cy="36.8" r="1.2" fill="#ffffff"/>
        </g>
        
        <!-- Lengüita feliz -->
        <path id="boca" d="M 45 53 Q 50 57 55 53" fill="none" stroke="#1f110b" stroke-width="1.8" stroke-linecap="round"/>
        
        <!-- Patitas -->
        <g id="patitas">
          <ellipse cx="40" cy="80" rx="6" ry="5" fill="#fef3c7" stroke="#b45309" stroke-width="1"/>
          <ellipse cx="60" cy="80" rx="6" ry="5" fill="#fef3c7" stroke="#b45309" stroke-width="1"/>
        </g>
      </svg>
    </div>

    <div class="shadow"></div>
  </div>

  <div class="controls">
    <button class="btn" id="btn-comer" onclick="alimentar()">
      <span class="btn-icon">🥣</span>
      <span>Alimentar</span>
    </button>
    <button class="btn" id="btn-jugar" onclick="jugar()">
      <span class="btn-icon">🥏</span>
      <span>Jugar</span>
    </button>
  </div>

  <script>
    let hambre = parseInt(localStorage.getItem('dogui_hambre')) || 100;
    let felicidad = parseInt(localStorage.getItem('dogui_felicidad')) || 100;

    const fillHambre = document.getElementById('fill-hambre');
    const fillFelicidad = document.getElementById('fill-felicidad');
    const txtHambre = document.getElementById('txt-hambre');
    const txtFelicidad = document.getElementById('txt-felicidad');
    const ojos = document.getElementById('ojos');
    const boca = document.getElementById('boca');
    const bocadillo = document.getElementById('bocadillo');
    const michiBox = document.getElementById('michi-box');
    const stageArea = document.getElementById('stage-area');

    const frasesComer = [
      "🥣 ¡Mmm... qué rica comida!",
      "🐶 ¡Guau, gracias por mi alimento!",
      "😋 ¡Mi pancita está muy contenta!",
      "🥣 ¡Ñam ñam, qué rico!"
    ];

    const frasesJugar = [
      "🥏 ¡Guau! ¡Atrapé el frisbee en el aire!",
      "🐾 ¡Me encanta correr contigo!",
      "🥏 ¡Qué divertido juego!",
      "🏃‍♂️ ¡Eres el mejor compañero!"
    ];

    const sabiduriaCanina = [
      "💡 Cuidado real: Los perros necesitan agua fresca y limpia disponible todo el día.",
      "💡 Cuidado real: Nunca les des chocolate, uvas, cebolla ni ajo; son veneno para su salud.",
      "💡 Cuidado real: Sacar a pasear a tu perro estimula su mente y previene la ansiedad en casa.",
      "💡 Cuidado real: Cepillar su pelaje de forma regular mantiene su piel sana y sin enredos.",
      "💡 Cuidado real: Los perros demuestran afecto buscando el contacto físico y moviendo la cola.",
      "📜 Curiosidad: El sentido del olfato de un perro puede ser hasta 100.000 veces más potente que el humano.",
      "📜 Curiosidad: Los perros sudan principalmente a través de las almohadillas de sus patas.",
      "📜 Curiosidad: Mueven la cola hacia la derecha cuando están felices y hacia la izquierda si están inseguros.",
      "📜 Curiosidad: Duermen aproximadamente la mitad de su vida entre siestas y horas nocturnas."
    ];

    function guardar() {
      localStorage.setItem('dogui_hambre', hambre);
      localStorage.setItem('dogui_felicidad', felicidad);
    }

    function mostrarTexto(msg) {
      bocadillo.innerText = msg;
    }

    function obtenerElementoAleatorio(array) {
      return array[Math.floor(Math.random() * array.length)];
    }

    function actualizarInterfaz(mensajePersonalizado = null) {
      fillHambre.style.width = hambre + '%';
      fillFelicidad.style.width = felicidad + '%';
      txtHambre.innerText = hambre + '%';
      txtFelicidad.innerText = felicidad + '%';

      if (hambre <= 0 || felicidad <= 0) {
        ojos.innerHTML = `
          <path d="M 36 36 L 42 42" stroke="#1f110b" stroke-width="2" stroke-linecap="round"/>
          <path d="M 36 42 L 42 36" stroke="#1f110b" stroke-width="2" stroke-linecap="round"/>
          <path d="M 58 36 L 64 42" stroke="#1f110b" stroke-width="2" stroke-linecap="round"/>
          <path d="M 58 42 L 64 36" stroke="#1f110b" stroke-width="2" stroke-linecap="round"/>
        `;
        boca.setAttribute('d', 'M 45 56 Q 50 51 55 56');
        
        if (mensajePersonalizado) {
          mostrarTexto(mensajePersonalizado);
        } else if (hambre <= 0 && felicidad <= 0) {
          mostrarTexto("😿 ¡Tengo hambre y tristeza! Toca 'Alimentar' 🥣 y 'Jugar' 🥏");
        } else if (hambre <= 0) {
          mostrarTexto("😾 ¡Tengo mucha hambre! Toca 'Alimentar' 🥣");
        } else {
          mostrarTexto("😿 Estoy triste... Presiona 'Jugar' 🥏");
        }
      } else if (hambre < 40 || felicidad < 40) {
        ojos.innerHTML = `
          <circle cx="39" cy="38" r="3" fill="#1f110b"/>
          <circle cx="61" cy="38" r="3" fill="#1f110b"/>
        `;
        boca.setAttribute('d', 'M 45 54 L 55 54');
        
        if (mensajePersonalizado) {
          mostrarTexto(mensajePersonalizado);
        } else if (hambre < 40 && felicidad < 40) {
          mostrarTexto("🙀 Presiona 'Alimentar' 🥣 y 'Jugar' 🥏 para alegrarme.");
        } else if (hambre < 40) {
          mostrarTexto("😾 ¡Siento un poco de hambre! Presiona 'Alimentar' 🥣");
        } else {
          mostrarTexto("😿 Me estoy aburriendo... Presiona 'Jugar' 🥏.");
        }
      } else {
        ojos.innerHTML = `
          <circle cx="39" cy="38" r="4" fill="#1f110b"/>
          <circle cx="37.8" cy="36.8" r="1.2" fill="#ffffff"/>
          <circle cx="61" cy="38" r="4" fill="#1f110b"/>
          <circle cx="59.8" cy="36.8" r="1.2" fill="#ffffff"/>
        `;
        boca.setAttribute('d', 'M 45 53 Q 50 57 55 53');
        if (mensajePersonalizado) {
          mostrarTexto(mensajePersonalizado);
        }
      }
    }

    function triggerAnim(className) {
      michiBox.classList.remove('happy-bounce', 'eat-wiggle', 'catch-ball');
      void michiBox.offsetWidth;
      michiBox.classList.add(className);
    }

    function spawnHeart(e) {
      const heart = document.createElement('div');
      heart.className = 'heart-particle';
      heart.innerText = '💖';
      const rect = michiBox.getBoundingClientRect();
      heart.style.left = (e.clientX || (rect.left + rect.width / 2)) + 'px';
      heart.style.top = (e.clientY || (rect.top + rect.height / 2)) + 'px';
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 1000);
    }

    function alimentar() {
      hambre = Math.min(100, hambre + 25);
      if (felicidad < 20) felicidad = Math.min(100, felicidad + 10);
      guardar();

      const bowl = document.createElement('div');
      bowl.className = 'animated-item anim-bowl';
      bowl.innerText = '🥣';
      stageArea.appendChild(bowl);

      boca.setAttribute('d', 'M 45 52 Q 50 60 55 52');

      setTimeout(() => {
        triggerAnim('eat-wiggle');
        bowl.remove();
        actualizarInterfaz(obtenerElementoAleatorio(frasesComer));
      }, 500);
    }

    function jugar() {
      felicidad = Math.min(100, felicidad + 25);
      hambre = Math.max(0, hambre - 5);
      guardar();

      const frisbee = document.createElement('div');
      frisbee.className = 'animated-item anim-frisbee';
      frisbee.innerText = '🥏';
      stageArea.appendChild(frisbee);

      setTimeout(() => {
        triggerAnim('catch-ball');
      }, 200);

      setTimeout(() => {
        frisbee.remove();
        actualizarInterfaz(obtenerElementoAleatorio(frasesJugar));
      }, 700);
    }

    function acariciar(e) {
      spawnHeart(e);
      triggerAnim('happy-bounce');
      if (hambre < 40 || felicidad < 40) {
        actualizarInterfaz();
      } else {
        actualizarInterfaz(obtenerElementoAleatorio(sabiduriaCanina));
      }
    }

    setInterval(() => {
      if (hambre > 0 || felicidad > 0) {
        hambre = Math.max(0, hambre - 2);
        felicidad = Math.max(0, felicidad - 2);
        guardar();
        actualizarInterfaz();
      }
    }, 4000);

    window.addEventListener('load', () => {
      actualizarInterfaz();
    });
  </script>
</body>
</html>
